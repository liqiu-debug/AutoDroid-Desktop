# Windows 安装包 CI（推送到 GitHub 后自动出包，无需本地 Windows 机器）
#
# 用法：把 AutoDroid-Desktop 推送到 GitHub（与 AutoDroid 平台仓库同组织），
# 本工作流在 windows-latest 上构建 引擎 → 前端 → NSIS 安装包：
#   - 产物挂在 Actions 运行页的 Artifacts（AutoDroid-Windows-Setup）
#   - 由 tag 触发时，electron-builder 自动发布到该 tag 的 GitHub Release
#     （Windows 客户端「检查更新」按 .exe 资产取包，不挂 Release 就收不到更新）
#
# 触发：手动 workflow_dispatch（按需出包），或打 tag 时。
#
# 注意：脚本必须以 UTF-8 **带 BOM** 保存。CI 里调用的是 Windows PowerShell 5.1
# 的话，无 BOM 的中文串会被按 ANSI 解析导致引号错位（TerminatorExpectedAtEndOfString）。
name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout AutoDroid-Desktop
        uses: actions/checkout@v4
        with:
          path: AutoDroid-Desktop

      - name: Checkout AutoDroid (frontend dist 源)
        uses: actions/checkout@v4
        with:
          repository: liqiu-debug/AutoDroid
          path: AutoDroid

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend dist
        working-directory: AutoDroid/frontend
        run: |
          npm install
          npm run build

      - name: Build engine + installer
        working-directory: AutoDroid-Desktop
        shell: pwsh
        env:
          # electron-builder 的 GitHub 自动发布认 GH_TOKEN / GITHUB_TOKEN；
          # Actions 自带的 GITHUB_TOKEN（本 workflow 已申请 contents: write）即可，
          # 本机手动跑脚本时改用自己的 PAT：export GH_TOKEN=<classic token, 勾 repo>
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File .\build-windows.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoDroid-Windows-Setup
          path: AutoDroid-Desktop/release/*.exe
          if-no-files-found: error
