name: build-macos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            native_arch: arm64
            app_dir: mac-arm64
          - runner: macos-15-intel
            arch: x64
            native_arch: x86_64
            app_dir: mac
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET_ARCH: ${{ matrix.arch }}
      NATIVE_ARCH: ${{ matrix.native_arch }}
      APP_DIR: ${{ matrix.app_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: AutoDroid-Desktop

      - name: Read pinned frontend revision
        id: frontend
        run: echo "ref=$(cat AutoDroid-Desktop/frontend-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: liqiu-debug/AutoDroid
          ref: ${{ steps.frontend.outputs.ref }}
          path: AutoDroid

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Build pinned frontend
        working-directory: AutoDroid/frontend
        run: npm ci && npm run build

      - name: Verify and build native engine
        working-directory: AutoDroid-Desktop
        run: |
          test "$(uname -m)" = "$NATIVE_ARCH"
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pytest pyinstaller
          .venv/bin/python -m pytest tests/test_desktop_ocr.py tests/test_ocr_retry_contract.py tests/test_image_click_contract.py tests/test_image_match_preview_api.py -q
          npm ci
          npm run check
          npm run dist:engine
          release-engine/autodroid-engine/autodroid-engine --check-ocr
          test "$(lipo -archs release-engine/autodroid-engine/autodroid-engine)" = "$NATIVE_ARCH"
          bash scripts/fetch-platform-tools.sh darwin
          bash scripts/check-dist-prereqs.sh darwin

      - name: Package and verify installer
        working-directory: AutoDroid-Desktop
        run: |
          npx electron-builder --dir --mac --"$TARGET_ARCH" --publish never --config.mac.identity=null
          app="release/$APP_DIR/AutoDroid.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/engine-bin/autodroid-engine/autodroid-engine" --check-ocr
          npx electron-builder --prepackaged "$app" --mac dmg zip --"$TARGET_ARCH" --publish never --config.mac.identity=null
          for archive in release/*.zip; do unzip -tq "$archive"; done
          mount_dir="$(mktemp -d)"
          for disk in release/*.dmg; do
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$disk"
            trap 'hdiutil detach "$mount_dir" || true' EXIT
            codesign --verify --deep --strict "$mount_dir/AutoDroid.app"
            "$mount_dir/AutoDroid.app/Contents/Resources/engine-bin/autodroid-engine/autodroid-engine" --check-ocr
            hdiutil detach "$mount_dir"
            trap - EXIT
          done

      - name: Upload installers to release
        working-directory: AutoDroid-Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.blockmap --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-update-${{ matrix.arch }}
          path: AutoDroid-Desktop/release/latest-mac.yml
          if-no-files-found: error

  update-metadata:
    needs: macos
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-update-*
          path: metadata
      - name: Merge architecture update metadata
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          arm = yaml.safe_load(Path('metadata/macos-update-arm64/latest-mac.yml').read_text())
          intel = yaml.safe_load(Path('metadata/macos-update-x64/latest-mac.yml').read_text())
          assert 'v' + arm['version'] == 'v' + intel['version'] == os.environ['RELEASE_TAG']
          intel['files'] = arm['files'] + intel['files']
          Path('latest-mac.yml').write_text(yaml.safe_dump(intel, sort_keys=False))
          PY
          gh release upload "$RELEASE_TAG" latest-mac.yml --repo "$GITHUB_REPOSITORY"
